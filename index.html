<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life RPG & Finanças</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d26;
      --card-border: #2a2e3d;
      --text: #f0f2f8;
      --text-dim: #8b92a5;
      --accent-green: #22c55e;
      --accent-blue: #3b82f6;
      --accent-purple: #a855f7;
      --accent-orange: #f97316;
      --accent-yellow: #eab308;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 80px;
    }

    header {
      position: relative;
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.5rem;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    header p {
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .sound-toggle-btn {
      position: absolute;
      top: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 20px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* CARD DE ATRIBUTOS */
    .stats-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 12px;
    }

    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .stat-bar-bg {
      height: 8px;
      background-color: #262a36;
      border-radius: 4px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    /* FORMULÁRIOS DE CRIAÇÃO */
    .add-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .input-field, select {
      width: 100%;
      background-color: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .form-row {
      display: flex;
      gap: 8px;
    }

    input[type="color"] {
      width: 44px;
      height: 42px;
      padding: 2px;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      cursor: pointer;
    }

    /* TAREFAS DIÁRIAS */
    .tasks-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
    }

    .task-item.completed {
      opacity: 0.5;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      cursor: pointer;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .task-item.completed .checkbox {
      background-color: var(--accent-green);
      border-color: var(--accent-green);
      color: #000;
    }

    .task-info {
      display: flex;
      flex-direction: column;
    }

    .task-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .task-reward {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .delete-btn:hover {
      color: var(--accent-red);
    }

    .reset-day-btn {
      width: 100%;
      margin-top: 12px;
      background-color: transparent;
      border: 1px dashed var(--card-border);
      color: var(--text-dim);
      padding: 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-day-btn:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    /* PAINEL FINANCEIRO */
    .finance-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .chart-container {
      position: relative;
      width: 160px;
      height: 160px;
    }

    .chart-container svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .chart-bg {
      fill: none;
      stroke: #262a36;
      stroke-width: 12;
    }

    .chart-progress {
      fill: none;
      stroke: var(--accent-green);
      stroke-width: 12;
      stroke-dasharray: 440;
      stroke-dashoffset: 440;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s ease;
    }

    .chart-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .chart-percent {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent-green);
    }

    .chart-subtitle {
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .finance-inputs {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    button {
      background-color: var(--accent-green);
      color: #000;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button.btn-withdraw {
      background-color: #311c22;
      color: var(--accent-red);
      border: 1px solid #52232a;
    }

    button:hover {
      opacity: 0.9;
    }

    .finance-summary {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-dim);
      border-top: 1px solid var(--card-border);
      padding-top: 10px;
    }

    .finance-summary span strong {
      color: var(--text);
    }
  </style>
</head>
<body>

  <header>
    <button class="sound-toggle-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
    <h1>🎮 LIFE RPG</h1>
    <p>Evolua na vida real</p>
  </header>

  <!-- SEÇÃO DE ATRIBUTOS -->
  <div class="section-title">⚡ Atributos & Níveis</div>
  <div class="stats-card" id="statsContainer"></div>

  <!-- CRIAR NOVO ATRIBUTO -->
  <div class="add-card">
    <div class="form-row">
      <input type="text" id="newStatName" class="input-field" placeholder="Novo Atributo (ex: Foco)">
      <input type="color" id="newStatColor" value="#3b82f6" title="Escolha uma cor">
      <button onclick="addNewStat()">+ Atributo</button>
    </div>
  </div>

  <!-- SEÇÃO DE TAREFAS DIÁRIAS -->
  <div class="section-title">✅ Hábitos Diários</div>

  <!-- ADICIONAR NOVA TAREFA -->
  <div class="add-card">
    <input type="text" id="newTaskTitle" class="input-field" placeholder="Ex: Meditar 10 minutos">
    <div class="form-row">
      <select id="newTaskStat"></select>
      <input type="number" id="newTaskXp" class="input-field" placeholder="XP" value="20" min="5" max="100" style="width: 80px;">
      <button onclick="addNewTask()">+ Criar</button>
    </div>
  </div>

  <div class="tasks-list" id="tasksContainer"></div>
  <button class="reset-day-btn" onclick="resetDayManually()">🔄 Renovar Hábitos do Dia</button>

  <!-- SEÇÃO FINANÇAS -->
  <div class="section-title">💰 Meta Financeira</div>
  <div class="finance-card">
    <div class="chart-container">
      <svg viewBox="0 0 160 160">
        <circle class="chart-bg" cx="80" cy="80" r="70"></circle>
        <circle class="chart-progress" id="financeCircle" cx="80" cy="80" r="70"></circle>
      </svg>
      <div class="chart-text">
        <div class="chart-percent" id="financePercent">0%</div>
        <div class="chart-subtitle">Concluído</div>
      </div>
    </div>

    <div class="finance-inputs">
      <div class="input-group">
        <input type="number" id="depositInput" class="input-field" placeholder="Valor (R$)" min="0" step="10">
        <button onclick="addFunds()">+ Guardar</button>
        <button class="btn-withdraw" onclick="withdrawFunds()">- Retirar</button>
      </div>
    </div>

    <div class="finance-summary">
      <span>Guardado: <strong id="savedAmount">R$ 0</strong></span>
      <span>Meta: <strong>R$ 30.000</strong></span>
    </div>
  </div>

  <script>
    const GOAL_FINANCE = 30000;
    const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * 70;

    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    document.addEventListener('touchstart', initAudio, { once: true });
    document.addEventListener('click', initAudio, { once: true });

    function playTone(freq, type, duration, delay = 0, startVol = 0.1) {
      if (!soundEnabled) return;
      initAudio();
      
      setTimeout(() => {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          
          gain.gain.setValueAtTime(startVol, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
          
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch(e) {
          console.log(e);
        }
      }, delay);
    }

    function playSound(type) {
      if (!soundEnabled) return;
      
      if (type === 'check') {
        // "Pop" sutil e satisfatório
        playTone(600, 'sine', 0.05, 0, 0.08);
      } else if (type === 'levelup') {
        // Acorde suave ascendente
        playTone(523.25, 'sine', 0.12, 0, 0.08);   // C5
        playTone(659.25, 'sine', 0.12, 70, 0.08);  // E5
        playTone(783.99, 'sine', 0.18, 140, 0.08); // G5
      } else if (type === 'money') {
        // Barulhinho sutil de moeda tinindo
        playTone(1800, 'sine', 0.04, 0, 0.05);
        playTone(2400, 'sine', 0.08, 40, 0.05);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').innerText = soundEnabled ? '🔊' : '🔇';
      localStorage.setItem('lifeRpgSound', JSON.stringify(soundEnabled));
      if (soundEnabled) playSound('check');
    }

    let appData = {
      savedMoney: 0,
      lastDate: new Date().toDateString(),
      stats: {
        forca: { name: 'Força', level: 1, xp: 0, color: '#f97316' },
        inteligencia: { name: 'Inteligência', level: 1, xp: 0, color: '#3b82f6' },
        saude: { name: 'Saúde', level: 1, xp: 0, color: '#22c55e' },
        carisma: { name: 'Carisma', level: 1, xp: 0, color: '#a855f7' },
        disciplina: { name: 'Disciplina', level: 1, xp: 0, color: '#eab308' }
      },
      tasks: [
        { id: 1, title: '💪 Treinar', stat: 'forca', xpReward: 25, completed: false },
        { id: 2, title: '💊 Tomar Creatina', stat: 'saude', xpReward: 15, completed: false },
        { id: 3, title: '📚 Ler 10 páginas', stat: 'inteligencia', xpReward: 20, completed: false },
        { id: 4, title: '💧 Beber 3L de Água', stat: 'saude', xpReward: 15, completed: false },
        { id: 5, title: '🗣️ Treinar Oratória / Socializar', stat: 'carisma', xpReward: 20, completed: false },
        { id: 6, title: '🎯 Cumprir Rotina sem Procrastinar', stat: 'disciplina', xpReward: 30, completed: false }
      ]
    };

    function checkDailyReset() {
      const today = new Date().toDateString();
      if (appData.lastDate !== today) {
        appData.tasks.forEach(t => t.completed = false);
        appData.lastDate = today;
        saveData();
      }
    }

    function resetDayManually() {
      if (confirm("Deseja desmarcar todas as tarefas para um novo dia? (Seu XP acumulado NÃO será perdido)")) {
        appData.tasks.forEach(t => t.completed = false);
        appData.lastDate = new Date().toDateString();
        saveData();
        renderTasks();
      }
    }

    function loadData() {
      const saved = localStorage.getItem('lifeRpgData');
      if (saved) {
        appData = JSON.parse(saved);
      }
      const savedSound = localStorage.getItem('lifeRpgSound');
      if (savedSound !== null) {
        soundEnabled = JSON.parse(savedSound);
        document.getElementById('soundBtn').innerText = soundEnabled ? '🔊' : '🔇';
      }

      checkDailyReset();
      renderStats();
      renderStatSelectOptions();
      renderTasks();
      renderFinance();
    }

    function saveData() {
      localStorage.setItem('lifeRpgData', JSON.stringify(appData));
    }

    function getXpForNextLevel(level) {
      return level * 100;
    }

    function renderStats() {
      const container = document.getElementById('statsContainer');
      container.innerHTML = '';

      for (let key in appData.stats) {
        const stat = appData.stats[key];
        const nextXp = getXpForNextLevel(stat.level);
        const percent = Math.min((stat.xp / nextXp) * 100, 100);

        container.innerHTML += `
          <div class="stat-row">
            <div class="stat-header">
              <span>${stat.name} (Nível ${stat.level})</span>
              <span>${stat.xp} / ${nextXp} XP</span>
            </div>
            <div class="stat-bar-bg">
              <div class="stat-bar-fill" style="width: ${percent}%; background-color: ${stat.color}"></div>
            </div>
          </div>
        `;
      }
    }

    function renderStatSelectOptions() {
      const select = document.getElementById('newTaskStat');
      select.innerHTML = '';
      for (let key in appData.stats) {
        select.innerHTML += `<option value="${key}">${appData.stats[key].name}</option>`;
      }
    }

    function addNewStat() {
      const nameInput = document.getElementById('newStatName');
      const colorInput = document.getElementById('newStatColor');

      const name = nameInput.value.trim();
      const color = colorInput.value;

      if (!name) return;

      const key = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_');

      if (!appData.stats[key]) {
        appData.stats[key] = {
          name: name,
          level: 1,
          xp: 0,
          color: color
        };
        nameInput.value = '';
        saveData();
        renderStats();
        renderStatSelectOptions();
      }
    }

    function renderTasks() {
      const container = document.getElementById('tasksContainer');
      container.innerHTML = '';

      appData.tasks.forEach(task => {
        const statName = appData.stats[task.stat]?.name || task.stat;
        container.innerHTML += `
          <div class="task-item ${task.completed ? 'completed' : ''}">
            <div class="task-left" onclick="toggleTask(${task.id})">
              <div class="checkbox">${task.completed ? '✓' : ''}</div>
              <div class="task-info">
                <span class="task-title">${task.title}</span>
                <span class="task-reward">+${task.xpReward} XP em ${statName}</span>
              </div>
            </div>
            <button class="delete-btn" onclick="deleteTask(${task.id})">✕</button>
          </div>
        `;
      });
    }

    function addNewTask() {
      const titleInput = document.getElementById('newTaskTitle');
      const statSelect = document.getElementById('newTaskStat');
      const xpInput = document.getElementById('newTaskXp');

      const title = titleInput.value.trim();
      const stat = statSelect.value;
      const xpReward = parseInt(xpInput.value) || 20;

      if (!title || !stat) return;

      const newTask = {
        id: Date.now(),
        title: title,
        stat: stat,
        xpReward: xpReward,
        completed: false
      };

      appData.tasks.push(newTask);
      titleInput.value = '';
      saveData();
      renderTasks();
    }

    function deleteTask(id) {
      appData.tasks = appData.tasks.filter(t => t.id !== id);
      saveData();
      renderTasks();
    }

    function toggleTask(id) {
      const task = appData.tasks.find(t => t.id === id);
      if (!task) return;

      task.completed = !task.completed;
      const stat = appData.stats[task.stat];
      let leveledUp = false;

      if (stat) {
        if (task.completed) {
          stat.xp += task.xpReward;
          while (stat.xp >= getXpForNextLevel(stat.level)) {
            stat.xp -= getXpForNextLevel(stat.level);
            stat.level++;
            leveledUp = true;
          }
          if (leveledUp) {
            playSound('levelup');
          } else {
            playSound('check');
          }
        } else {
          stat.xp -= task.xpReward;
          if (stat.xp < 0) stat.xp = 0;
        }
      }

      saveData();
      renderStats();
      renderTasks();
    }

    function renderFinance() {
      const saved = appData.savedMoney;
      const percent = Math.min((saved / GOAL_FINANCE) * 100, 100);

      document.getElementById('savedAmount').innerText = `R$ ${saved.toLocaleString('pt-BR')}`;
      document.getElementById('financePercent').innerText = `${percent.toFixed(1)}%`;

      const circle = document.getElementById('financeCircle');
      const offset = CIRCLE_CIRCUMFERENCE - (percent / 100) * CIRCLE_CIRCUMFERENCE;
      circle.style.strokeDashoffset = offset;
    }

    function addFunds() {
      const input = document.getElementById('depositInput');
      const val = parseFloat(input.value);

      if (!isNaN(val) && val > 0) {
        appData.savedMoney += val;
        input.value = '';
        playSound('money');
        saveData();
        renderFinance();
      }
    }

    function withdrawFunds() {
      const input = document.getElementById('depositInput');
      const val = parseFloat(input.value);

      if (!isNaN(val) && val > 0) {
        if (appData.savedMoney - val < 0) {
          alert("O valor de retirada não pode ser maior do que o montante guardado.");
          return;
        }
        appData.savedMoney -= val;
        input.value = '';
        playSound('money');
        saveData();
        renderFinance();
      }
    }

    loadData();
  </script>
</body>
</html>
