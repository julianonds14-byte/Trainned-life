<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life RPG</title>
    <!-- SDK Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #ff6600;
            --text-color: #ffffff;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --vip-color: #eab308;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #auth-container {
            background-color: var(--card-bg);
            padding: 30px 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #auth-container h2 {
            font-size: 1.8rem;
            margin-bottom: 6px;
            font-weight: 700;
        }

        #auth-container p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .auth-input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0d1117;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .auth-input:focus {
            border-color: var(--accent-color);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            margin-top: 12px;
        }

        #status-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            min-height: 20px;
            word-break: break-word;
        }

        #app-container {
            display: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .vip-badge {
            background: linear-gradient(45deg, #eab308, #ca8a04);
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            display: none;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stat-item {
            margin-bottom: 15px;
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #21262d;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #21262d;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .task-item.completed {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .task-btn {
            background-color: var(--accent-color);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--error-color);
            color: var(--error-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- ECRÃ DE LOGIN ORIGINAL -->
    <div id="auth-container">
        <h2>Life RPG</h2>
        <p>Acesse a sua conta ou registe-se</p>
        
        <input type="email" id="auth-email" class="auth-input" placeholder="julianonds14@gmail.com">
        <input type="password" id="auth-password" class="auth-input" placeholder="••••••••••••">
        
        <button class="auth-btn" onclick="handleLogin()">Entrar</button>
        <button class="auth-btn btn-secondary" onclick="handleSignUp()">Cadastrar Nova Conta</button>

        <div id="status-msg"></div>
    </div>

    <!-- ECRÃ PRINCIPAL -->
    <div id="app-container">
        <header>
            <div>
                <h2 style="display:inline;">Life RPG</h2>
                <span id="vip-badge" class="vip-badge">VIP ATIVO</span>
            </div>
            <button class="logout-btn" onclick="handleLogout()">Sair</button>
        </header>

        <div class="card">
            <h3>Atributos</h3>
            <div id="stats-container" style="margin-top: 15px;"></div>
        </div>

        <div class="card">
            <h3>Rotina Diária</h3>
            <div id="tasks-container" style="margin-top: 15px;"></div>
        </div>

        <div class="card">
            <h3 style="color: var(--vip-color);">Ativar Código VIP</h3>
            <div style="display:flex; gap: 10px; margin-top: 10px;">
                <input type="text" id="vip-code-input" class="auth-input" style="margin:0;" placeholder="Insira seu código VIP">
                <button class="auth-btn" style="width: auto; background-color: var(--vip-color); color: #000;" onclick="activateVipCode()">Ativar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ukjkgcnwjflttakeijhj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVramtnY253amZsdHRha2VpamhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NTg3MjEsImV4cCI6MjEwNjEzNDcyMX0.aR-2C3M-s9xuNZ_-BarmGSi5zFFfUU6qt9sa1EiGWhc';

        let supabaseClient = null;
        let currentUser = null;

        function showStatus(msg, isError = false) {
            const el = document.getElementById('status-msg');
            if (el) {
                el.style.color = isError ? 'var(--error-color)' : 'var(--accent-color)';
                el.innerText = msg;
            }
        }

        window.onload = function() {
            try {
                if (window.supabase && window.supabase.createClient) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    checkSession();
                } else {
                    showStatus('Erro: Supabase não carregou.', true);
                }
            } catch (err) {
                showStatus('Erro: ' + err.message, true);
            }
        };

        const defaultData = {
            is_vip: false,
            vip_expires_at: 0,
            stats: {
                forca: { name: "Força", level: 1, xp: 0, color: "#ff6600" },
                inteligencia: { name: "Inteligência", level: 1, xp: 0, color: "#3b82f6" },
                saude: { name: "Saúde", level: 1, xp: 0, color: "#22c55e" }
            },
            tasks: [
                { id: 1, title: "💪 Treinar", stat: "forca", xpReward: 25, completed: false },
                { id: 2, title: "💊 Tomar Creatina", stat: "saude", xpReward: 15, completed: false },
                { id: 3, title: "📚 Ler 10 páginas", stat: "inteligencia", xpReward: 20, completed: false }
            ]
        };

        let userData = JSON.parse(JSON.stringify(defaultData));

        async function handleLogin() {
            showStatus('Entrando...');
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if (!email || !password) {
                showStatus('Preencha e-mail e palavra-passe.', true);
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    showStatus('Erro: ' + error.message, true);
                    return;
                }
                currentUser = data.user;
                await loadUserData();
                showAppInterface();
            } catch (e) {
                showStatus('Erro ao entrar: ' + e.message, true);
            }
        }

        async function handleSignUp() {
            showStatus('A criar conta...');
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if (!email || !password) {
                showStatus('Preencha e-mail e palavra-passe.', true);
                return;
            }

            if (password.length < 6) {
                showStatus('A palavra-passe deve ter pelo menos 6 caracteres.', true);
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    showStatus('Erro: ' + error.message, true);
                    return;
                }
                if (data.user) {
                    currentUser = data.user;
                    await initUserData(currentUser.id);
                    showStatus('Conta criada!');
                    showAppInterface();
                }
            } catch (e) {
                showStatus('Erro ao registar: ' + e.message, true);
            }
        }

        async function handleLogout() {
            if (supabaseClient) await supabaseClient.auth.signOut();
            location.reload();
        }

        async function initUserData(userId) {
            const payload = { id: userId, ...defaultData };
            await supabaseClient.from('user_data').insert([payload]);
        }

        async function loadUserData() {
            const { data } = await supabaseClient.from('user_data').select('*').eq('id', currentUser.id).single();
            if (data) {
                userData = data;
                renderApp();
            } else {
                await initUserData(currentUser.id);
                userData = JSON.parse(JSON.stringify(defaultData));
                renderApp();
            }
        }

        async function saveUserData() {
            if (!currentUser || !supabaseClient) return;
            await supabaseClient.from('user_data').update(userData).eq('id', currentUser.id);
        }

        function activateVipCode() {
            const code = document.getElementById('vip-code-input').value.trim().toUpperCase();
            let durationDays = 0;

            if (code === 'VIPTEST10') durationDays = 10;
            else if (code === 'VIPMENSAL3030') durationDays = 30;
            else if (code === 'VIPANUAL365DIAS10') durationDays = 365;
            else {
                alert('Código VIP inválido.');
                return;
            }

            userData.is_vip = true;
            userData.vip_expires_at = Date.now() + (durationDays * 24 * 60 * 60 * 1000);
            saveUserData();
            renderApp();
            alert(`VIP ativado por ${durationDays} dias!`);
        }

        function renderApp() {
            document.getElementById('vip-badge').style.display = userData.is_vip ? 'inline-block' : 'none';

            const statsContainer = document.getElementById('stats-container');
            statsContainer.innerHTML = '';
            for (let key in userData.stats) {
                const stat = userData.stats[key];
                statsContainer.innerHTML += `
                    <div class="stat-item">
                        <div class="stat-header">
                            <span>${stat.name} (Nível ${stat.level})</span>
                            <span>${stat.xp}/100 XP</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${stat.xp}%; background-color: ${stat.color}"></div>
                        </div>
                    </div>
                `;
            }

            const tasksContainer = document.getElementById('tasks-container');
            tasksContainer.innerHTML = '';
            userData.tasks.forEach(task => {
                tasksContainer.innerHTML += `
                    <div class="task-item ${task.completed ? 'completed' : ''}">
                        <span>${task.title} (+${task.xpReward} XP)</span>
                        <button class="task-btn" onclick="completeTask(${task.id})" ${task.completed ? 'disabled' : ''}>
                            ${task.completed ? 'Concluída' : 'Concluir'}
                        </button>
                    </div>
                `;
            });
        }

        function completeTask(taskId) {
            const task = userData.tasks.find(t => t.id === taskId);
            if (!task || task.completed) return;

            task.completed = true;
            const stat = userData.stats[task.stat];
            if (stat) {
                stat.xp += task.xpReward;
                if (stat.xp >= 100) {
                    stat.level += 1;
                    stat.xp -= 100;
                    alert(`Nível ${stat.level} em ${stat.name}!`);
                }
            }
            saveUserData();
            renderApp();
        }

        function showAppInterface() {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
        }

        async function checkSession() {
            if (!supabaseClient) return;
            const { data } = await supabaseClient.auth.getSession();
            if (data && data.session) {
                currentUser = data.session.user;
                await loadUserData();
                showAppInterface();
            }
        }
    </script>
</body>
</html>
