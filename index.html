<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life RPG</title>
    <!-- SDK Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #f97316;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --vip-color: #eab308;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        #auth-container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
            margin-top: 40px;
        }

        .auth-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-secondary {
            background-color: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
        }

        #status-msg {
            margin-top: 15px;
            font-size: 0.95rem;
            min-height: 25px;
            word-break: break-word;
            font-weight: bold;
        }

        #app-container {
            display: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
        }

        .vip-badge {
            background: linear-gradient(45deg, #eab308, #ca8a04);
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            display: none;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stat-item {
            margin-bottom: 15px;
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #334155;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #334155;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .task-item.completed {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .task-btn {
            background-color: var(--accent-color);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .vip-section {
            border: 1px solid var(--vip-color);
            background: rgba(234, 179, 8, 0.05);
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ECRÃ DE LOGIN / REGISTO -->
    <div id="auth-container">
        <h2>Life RPG</h2>
        <p style="color: var(--text-secondary); margin-bottom: 15px; font-size: 0.9rem;">Acesse a sua conta ou registe-se</p>
        
        <input type="email" id="auth-email" class="auth-input" placeholder="O seu e-mail">
        <input type="password" id="auth-password" class="auth-input" placeholder="A sua palavra-passe (mínimo 6 caracteres)">
        
        <button class="auth-btn" onclick="handleLogin()">Entrar</button>
        <button class="auth-btn btn-secondary" onclick="handleSignUp()">Cadastrar Nova Conta</button>

        <div id="status-msg"></div>
    </div>

    <!-- ECRÃ PRINCIPAL -->
    <div id="app-container">
        <header>
            <div>
                <h2 style="display:inline;">Life RPG</h2>
                <span id="vip-badge" class="vip-badge">VIP ATIVO</span>
            </div>
            <button class="logout-btn" onclick="handleLogout()">Sair</button>
        </header>

        <!-- ATRIBUTOS -->
        <div class="card">
            <h3>Atributos</h3>
            <div id="stats-container" style="margin-top: 15px;"></div>
        </div>

        <!-- TAREFAS -->
        <div class="card">
            <h3>Rotina Diária</h3>
            <div id="tasks-container" style="margin-top: 15px;"></div>
        </div>

        <!-- CÓDIGO VIP -->
        <div class="card vip-section">
            <h3 style="color: var(--vip-color);">Ativar Código VIP</h3>
            <div style="display:flex; gap: 10px; margin-top: 10px;">
                <input type="text" id="vip-code-input" class="auth-input" style="margin:0;" placeholder="Insira seu código VIP">
                <button class="auth-btn" style="width: auto; background-color: var(--vip-color); color: #000;" onclick="activateVipCode()">Ativar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ukjkgcnwjflttakeijhj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVramtnY253amZsdHRha2VpamhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NTg3MjEsImV4cCI6MjEwNjEzNDcyMX0.aR-2C3M-s9xuNZ_-BarmGSi5zFFfUU6qt9sa1EiGWhc';

        let supabaseClient = null;
        let currentUser = null;

        function showStatus(msg, isError = false) {
            const el = document.getElementById('status-msg');
            if (el) {
                el.style.color = isError ? 'var(--error-color)' : 'var(--accent-color)';
                el.innerText = msg;
            }
        }

        window.onload = function() {
            try {
                if (window.supabase && window.supabase.createClient) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    checkSession();
                } else {
                    showStatus('Erro: Biblioteca do Supabase não carregou. Verifique a sua ligação.', true);
                }
            } catch (err) {
                showStatus('Erro de Inicialização: ' + err.message, true);
            }
        };

        const defaultData = {
            is_vip: false,
            vip_expires_at: 0,
            stats: {
                forca: { name: "Força", level: 1, xp: 0, color: "#f97316" },
                inteligencia: { name: "Inteligência", level: 1, xp: 0, color: "#3b82f6" },
                saude: { name: "Saúde", level: 1, xp: 0, color: "#22c55e" }
            },
            tasks: [
                { id: 1, title: "💪 Treinar", stat: "forca", xpReward: 25, completed: false },
                { id: 2, title: "💊 Tomar Creatina", stat: "saude", xpReward: 15, completed: false },
                { id: 3, title: "📚 Ler 10 páginas", stat: "inteligencia", xpReward: 20, completed: false }
            ]
        };

        let userData = JSON.parse(JSON.stringify(defaultData));

        async function handleLogin() {
            showStatus('A processar login...');
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if (!email || !password) {
                showStatus('Preencha o e-mail e a palavra-passe.', true);
                return;
            }

            if (!supabaseClient) {
                showStatus('Erro: Supabase não está pronto.', true);
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

                if (error) {
                    showStatus('Erro no Login: ' + error.message, true);
                    return;
                }

                currentUser = data.user;
                await loadUserData();
                showAppInterface();
            } catch (e) {
                showStatus('Exceção no Login: ' + e.message, true);
            }
        }

        async function handleSignUp() {
            showStatus('A criar conta...');
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if (!email || !password) {
                showStatus('Preencha e-mail e palavra-passe.', true);
                return;
            }

            if (password.length < 6) {
                showStatus('A palavra-passe deve ter pelo menos 6 caracteres.', true);
                return;
            }

            if (!supabaseClient) {
                showStatus('Erro: Supabase não está pronto.', true);
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });

                if (error) {
                    showStatus('Erro no Registo: ' + error.message, true);
                    return;
                }

                if (data.user) {
                    currentUser = data.user;
                    await initUserData(currentUser.id);
                    showStatus('Conta criada! A carregar...');
                    showAppInterface();
                }
            } catch (e) {
                showStatus('Exceção no Cadastro: ' + e.message, true);
            }
        }

        async function handleLogout() {
            if (supabaseClient) await supabaseClient.auth.signOut();
            location.reload();
        }

        async function initUserData(userId) {
            const payload = { id: userId, ...defaultData };
            await supabaseClient.from('user_data').insert([payload]);
        }

        async function loadUserData() {
            const { data } = await supabaseClient.from('user_data').select('*').eq('id', currentUser.id).single();
            if (data) {
                userData = data;
                checkVipExpiration();
                renderApp();
            } else {
                await initUserData(currentUser.id);
                userData = JSON.parse(JSON.stringify(defaultData));
                renderApp();
            }
        }

        async function saveUserData() {
            if (!currentUser || !supabaseClient) return;
            await supabaseClient.from('user_data').update(userData).eq('id', currentUser.id);
        }

        function checkVipExpiration() {
            if (userData.is_vip && userData.vip_expires_at > 0 && Date.now() > userData.vip_expires_at) {
                userData.is_vip = false;
                userData.vip_expires_at = 0;
                removeVipFeatures();
                saveUserData();
                alert('O seu período VIP expirou.');
            }
        }

        function activateVipCode() {
            const code = document.getElementById('vip-code-input').value.trim().toUpperCase();
            let durationDays = 0;

            if (code === 'VIPTEST10') durationDays = 10;
            else if (code === 'VIPMENSAL3030') durationDays = 30;
            else if (code === 'VIPANUAL365DIAS10') durationDays = 365;
            else {
                alert('Código VIP inválido.');
                return;
            }

            userData.is_vip = true;
            userData.vip_expires_at = Date.now() + (durationDays * 24 * 60 * 60 * 1000);
            injectVipFeatures();
            saveUserData();
            renderApp();
            alert(`Código VIP ativado com sucesso por ${durationDays} dias!`);
        }

        function injectVipFeatures() {
            if (!userData.stats.carisma) userData.stats.carisma = { name: "Carisma", level: 1, xp: 0, color: "#eab308" };
            if (!userData.stats.disciplina) userData.stats.disciplina = { name: "Disciplina", level: 1, xp: 0, color: "#a855f7" };
            if (!userData.stats.foco) userData.stats.foco = { name: "Foco", level: 1, xp: 0, color: "#06b6d4" };

            const vipTasks = [
                { id: 101, title: "💧 Beber 3L de Água", stat: "saude", xpReward: 20, completed: false },
                { id: 102, title: "🗣️ Treinar Oratória", stat: "carisma", xpReward: 30, completed: false },
                { id: 103, title: "📋 Cumprir Rotina", stat: "disciplina", xpReward: 35, completed: false },
                { id: 104, title: "🧊 Tomar banho gelado", stat: "foco", xpReward: 25, completed: false }
            ];

            vipTasks.forEach(vt => {
                if (!userData.tasks.some(t => t.id === vt.id)) userData.tasks.push(vt);
            });
        }

        function removeVipFeatures() {
            delete userData.stats.carisma;
            delete userData.stats.disciplina;
            delete userData.stats.foco;
            userData.tasks = userData.tasks.filter(t => t.id < 100);
        }

        function renderApp() {
            document.getElementById('vip-badge').style.display = userData.is_vip ? 'inline-block' : 'none';

            const statsContainer = document.getElementById('stats-container');
            statsContainer.innerHTML = '';
            for (let key in userData.stats) {
                const stat = userData.stats[key];
                statsContainer.innerHTML += `
                    <div class="stat-item">
                        <div class="stat-header">
                            <span>${stat.name} (Nível ${stat.level})</span>
                            <span>${stat.xp}/100 XP</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${stat.xp}%; background-color: ${stat.color}"></div>
                        </div>
                    </div>
                `;
            }

            const tasksContainer = document.getElementById('tasks-container');
            tasksContainer.innerHTML = '';
            userData.tasks.forEach(task => {
                tasksContainer.innerHTML += `
                    <div class="task-item ${task.completed ? 'completed' : ''}">
                        <span>${task.title} (+${task.xpReward} XP)</span>
                        <button class="task-btn" onclick="completeTask(${task.id})" ${task.completed ? 'disabled' : ''}>
                            ${task.completed ? 'Concluída' : 'Concluir'}
                        </button>
                    </div>
                `;
            });
        }

        function completeTask(taskId) {
            const task = userData.tasks.find(t => t.id === taskId);
            if (!task || task.completed) return;

            task.completed = true;
            const stat = userData.stats[task.stat];
            if (stat) {
                stat.xp += task.xpReward;
                if (stat.xp >= 100) {
                    stat.level += 1;
                    stat.xp -= 100;
                    alert(`Parabéns! Subiu para o Nível ${stat.level} em ${stat.name}!`);
                }
            }
            saveUserData();
            renderApp();
        }

        function showAppInterface() {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
        }

        async function checkSession() {
            if (!supabaseClient) return;
            const { data } = await supabaseClient.auth.getSession();
            if (data && data.session) {
                currentUser = data.session.user;
                await loadUserData();
                showAppInterface();
            }
        }
    </script>
</body>
</html>
